spring:
  application:
    name: university-booking

  jackson:
    serialization:
      write-dates-as-timestamps: false

  data:
    mongodb:
      uri: mongodb://localhost:27017/booking?directConnection=true
      auto-index-creation: false

    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  cache:
    type: redis

server:
  port: 8080
  error:
    include-message: always

app:
  cart:
    ttl-seconds: 900
  rate-limit:
    requests-per-minute: 60
  analytics:
    cache-ttl-seconds: 60

logging:
  level:
    com.university.booking: DEBUG
    org.springframework.data.redis: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
  structured:
    format:
      console: logstash